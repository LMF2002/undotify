<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undotify</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
        }

        /* 1. TOP BAR */
        .top-bar {
            background-color: #5c2d91; 
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 100px auto;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 2. TITLE */
        h1 {
            font-size: 36px;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        /* 3. DESCRIPTION */
        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        
        .url-input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            outline: none;
        }

            .url-input:focus {
                border-color: #5c2d91;
            }

        /* 4. BUTTON */
        .btn {
            background-color: #5c2d91;
            color: white;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

            .btn:hover {
                background-color: #44206d;
            }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <div>Undotify</div>
        <div style="font-size: 14px; font-weight: normal;">Beta</div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Title -->
        <h1>Undotify</h1>

        <!-- Description -->
        <p>an Modified Spotify app for Android - No ads, No interruptions, OLED Theme and many more features!</p>

       
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

        <!-- Alternative: Hardcoded Button -->
        <p style="font-size: 14px; margin-bottom: 10px;">Get app for Android</p>
        <a href="https://drive.google.com/file/d/12sw8LHEv5kfMFI0mKvM42pAZ7TaqnkxZ/view?usp=sharing" target="_blank" class="btn" style="background-color: #0078d7;">Download now</a>
    </main>

    <!-- JavaScript -->
    <script>
        function goToWebsite() {
            // Get the text from the input box
            var url = document.getElementById("websiteInput").value.trim();

            if (url === "") {
                alert("");
                return;
            }

            
            if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }

            // Open the website in a new tab
            window.open(url, "_blank");
        }
    </script>

</body>
</html>
